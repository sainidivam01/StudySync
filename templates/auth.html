<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Sync | {{ 'Create account' if mode == 'register' else 'Sign in' }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body class="auth-page">
<div class="auth-card">
  <h1 class="brand">Study<span>Sync</span></h1>
  <p class="muted">A digital study habit tracker for consistent academic engagement.</p>
  <h2>{{ 'Create your account' if mode == 'register' else 'Sign in' }}</h2>
  {% if error %}<div class="alert">{{ error }}</div>{% endif %}
  <form method="post">
    <label for="email">Email</label>
    <input class="in" id="email" name="email" type="email" required autocomplete="email">
    <label for="password">Password {% if mode == 'register' %}(8+ characters){% endif %}</label>
    <input class="in" id="password" name="password" type="password" required minlength="{{ 8 if mode == 'register' else 1 }}">
    <button class="btn" type="submit">{{ 'Create account' if mode == 'register' else 'Sign in' }}</button>
  </form>
  <p class="muted small">
    {% if mode == 'register' %}Already registered? <a href="{{ url_for('login') }}">Sign in</a>
    {% else %}New here? <a href="{{ url_for('register') }}">Create an account</a>{% endif %}
  </p>
</div></body></html>
